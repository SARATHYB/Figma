<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Design Prototypes — Sarathy B</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f1115;
    --panel: #161a21;
    --border: #262c36;
    --text: #e5e7eb;
    --muted: #8b93a1;
    --accent: #7c5cff;
    --accent-soft: rgba(124, 92, 255, 0.15);
  }

  html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  body {
    display: flex;
    flex-direction: column;
  }

  /* ---------- Header ---------- */
  header {
    padding: 20px 28px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }

  header h1 {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 0.3px;
  }

  header .quote {
    font-size: 12px;
    color: var(--muted);
    line-height: 1.5;
    max-width: 480px;
  }

  header .quote strong { color: var(--text); font-weight: 500; }

  /* ---------- Tabs ---------- */
  .tabs {
    display: flex;
    gap: 6px;
    padding: 12px 28px 0;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }

  .tab {
    flex-shrink: 0;
    padding: 10px 18px;
    background: transparent;
    border: none;
    border-bottom: 2px solid transparent;
    color: var(--muted);
    font-size: 13.5px;
    font-weight: 500;
    cursor: pointer;
    font-family: inherit;
    transition: color 0.15s ease, border-color 0.15s ease;
    white-space: nowrap;
  }

  .tab:hover { color: var(--text); }

  .tab.active {
    color: #ffffff;
    border-bottom-color: var(--accent);
  }

  .tab .badge {
    display: inline-block;
    font-size: 10px;
    font-weight: 600;
    padding: 2px 6px;
    border-radius: 4px;
    background: var(--accent-soft);
    color: var(--accent);
    margin-left: 6px;
    vertical-align: middle;
    letter-spacing: 0.3px;
  }

  /* ---------- Stage ---------- */
  .stage {
    flex: 1;
    position: relative;
    background:
      radial-gradient(circle at 20% 10%, rgba(124, 92, 255, 0.08), transparent 40%),
      radial-gradient(circle at 80% 90%, rgba(56, 189, 248, 0.06), transparent 40%),
      var(--bg);
    overflow: hidden;
  }

  .proto {
    position: absolute;
    inset: 0;
    display: none;
  }

  .proto.active { display: block; }

  .proto iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
    background: #ffffff;
  }

  /* Placeholder card */
  .placeholder {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px;
  }

  .placeholder-inner {
    max-width: 460px;
    text-align: center;
    background: var(--panel);
    border: 1px dashed var(--border);
    border-radius: 14px;
    padding: 48px 32px;
    position: relative;
  }

  .placeholder-inner::before {
    content: "🚧";
    display: block;
    font-size: 40px;
    margin-bottom: 16px;
  }

  .placeholder-inner h2 {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 8px;
  }

  .placeholder-inner p {
    font-size: 13.5px;
    color: var(--muted);
    line-height: 1.6;
  }

  .placeholder-inner .tag {
    display: inline-block;
    margin-top: 18px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    padding: 4px 10px;
    border-radius: 999px;
    background: var(--accent-soft);
    color: var(--accent);
  }

  /* ---------- Footer ---------- */
  footer {
    padding: 10px 28px;
    border-top: 1px solid var(--border);
    background: var(--panel);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    font-size: 12px;
    color: var(--muted);
  }

  footer a {
    color: var(--accent);
    text-decoration: none;
  }
  footer a:hover { text-decoration: underline; }

  /* ---------- Mobile ---------- */
  @media (max-width: 640px) {
    header { padding: 16px 18px 12px; }
    header h1 { font-size: 16px; }
    header .quote { display: none; }
    .tabs { padding: 8px 14px 0; }
    .tab { padding: 8px 12px; font-size: 12.5px; }
    footer { padding: 8px 16px; font-size: 11px; }
    footer .hint { display: none; }
  }
</style>
</head>
<body>

  <header>
    <div>
      <h1>FIGMA</h1>
      <div class="quote" style="margin-top:6px;">
        <strong>Design Prototypes</strong> Tailored, right from minimalistic to Gradient inspired Designs. - SARATHY
      </div>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab active" role="tab" data-index="0">GenReal.ai</button>
    <button class="tab" role="tab" data-index="1">Kalkini Website</button>
    <button class="tab" role="tab" data-index="2">Sonnet Dashboard</button>
    <button class="tab" role="tab" data-index="3">Project 04 <span class="badge">SOON</span></button>
  </nav>

  <main class="stage" id="stage">
    <!-- Prototype slots — src is injected on-demand by JS -->
    <div class="proto active" data-index="0"></div>
    <div class="proto" data-index="1"></div>
    <div class="proto" data-index="2"></div>
    <div class="proto" data-index="3"></div>
  </main>

  <footer>
    <span class="hint">Click a tab to preview a prototype · <a id="open-link" href="#" target="_blank" rel="noopener">Open in Figma ↗</a></span>
    <span id="status">Loading…</span>
  </footer>

<script>
  // ------------------------------------------------------------------
  // 1. PROTOTYPE CONFIG
  //    - url:    Figma embed URL (embed.figma.com/proto/...)
  //    - share:  Public Figma URL for "Open in new tab"
  //    - type:   "figma" | "placeholder"
  // ------------------------------------------------------------------
  const prototypes = [
    {
      title: "GenReal.ai — Landing Page",
      type: "figma",
      url: "https://embed.figma.com/proto/PLLI32RxdA8I4IasNQRDcZ/GenReal.ai-Landing-Page--Community-?node-id=8-4&starting-point-node-id=8%3A4&embed-host=share",
      share: "https://www.figma.com/proto/PLLI32RxdA8I4IasNQRDcZ/GenReal.ai-Landing-Page--Community-"
    },
    {
      title: "Kalkini — Website",
      type: "figma",
      url: "https://embed.figma.com/proto/5vzxNia4R3Psc8Bzqt89uF/Kalkini-website?node-id=105-1000&embed-host=share",
      share: "https://www.figma.com/proto/5vzxNia4R3Psc8Bzqt89uF/Kalkini-website"
    },
    {
      title: "Sonnet — Dashboard",
      type: "figma",
      url: "https://embed.figma.com/proto/XUCmcVjmjKHG2mZL3r5Smt/Sonnet-Dashboard?node-id=1-51&p=f&scaling=min-zoom&content-scaling=fixed&page-id=0%3A1&starting-point-node-id=1%3A51&embed-host=share",
      share: "https://www.figma.com/proto/XUCmcVjmjKHG2mZL3r5Smt/Sonnet-Dashboard"
    },
    {
      title: "Project 04",
      type: "placeholder",
      // When ready, change type to "figma" and fill in url + share
      url: "",
      share: ""
    }
  ];

  // ------------------------------------------------------------------
  // 2. State + DOM refs
  // ------------------------------------------------------------------
  const tabs       = document.querySelectorAll(".tab");
  const slots      = document.querySelectorAll(".proto");
  const stage      = document.getElementById("stage");
  const openLink   = document.getElementById("open-link");
  const statusEl   = document.getElementById("status");

  let current = -1;

  // ------------------------------------------------------------------
  // 3. Placeholder markup
  // ------------------------------------------------------------------
  function placeholderHTML() {
    return `
      <div class="placeholder">
        <div class="placeholder-inner">
          <h2>Coming Soon</h2>
          <p>This prototype is currently in progress. Check back shortly — or reach out if you'd like a walkthrough of the work-in-progress.</p>
          <span class="tag">In design</span>
        </div>
      </div>
    `;
  }

  // ------------------------------------------------------------------
  // 4. Render a prototype into its slot (lazy — only once)
  // ------------------------------------------------------------------
  function render(index) {
    const slot = slots[index];
    if (!slot || slot.dataset.rendered === "true") return;

    const proto = prototypes[index];

    if (proto.type === "figma" && proto.url) {
      const iframe = document.createElement("iframe");
      iframe.src = proto.url;
      iframe.allowFullscreen = true;
      iframe.title = proto.title;
      iframe.loading = "lazy";
      slot.appendChild(iframe);
    } else {
      slot.innerHTML = placeholderHTML();
    }

    slot.dataset.rendered = "true";
  }

  // ------------------------------------------------------------------
  // 5. Show a specific prototype
  // ------------------------------------------------------------------
  function show(index) {
    if (!prototypes[index]) return;

    current = index;
    const proto = prototypes[index];

    // Render only if not yet rendered
    render(index);

    // Toggle active slots
    slots.forEach((s, i) => s.classList.toggle("active", i === index));

    // Toggle active tab
    tabs.forEach((t, i) => t.classList.toggle("active", i === index));

    // Update footer link + status
    if (proto.type === "figma" && proto.share) {
      openLink.style.display = "inline";
      openLink.href = proto.share;
      openLink.textContent = "Open in Figma ↗";
    } else {
      openLink.style.display = "none";
    }

    statusEl.textContent = proto.title;

    // Deep-link
    history.replaceState(null, "", `#proto-${index + 1}`);
  }

  // ------------------------------------------------------------------
  // 6. Bind tabs
  // ------------------------------------------------------------------
  tabs.forEach((tab) => {
    tab.addEventListener("click", () => show(Number(tab.dataset.index)));
  });

  // ------------------------------------------------------------------
  // 7. Init from hash
  // ------------------------------------------------------------------
  function initFromHash() {
    const m = location.hash.match(/^#proto-(\d)$/);
    const start = m ? Math.min(Number(m[1]) - 1, prototypes.length - 1) : 0;
    show(start);
  }

  initFromHash();
  window.addEventListener("hashchange", initFromHash);
</script>

</body>
</html>
